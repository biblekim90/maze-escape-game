<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>미로찾기 게임</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1e1e2e;
    color: #eee;
    font-family: sans-serif;
  }
  h1 { margin: 10px 0; }
  #info { margin-bottom: 10px; font-size: 14px; color: #aaa; }
  #controls { display: flex; gap: 8px; margin-bottom: 12px; }
  .diff {
    padding: 7px 20px;
    font-size: 15px;
    border: 2px solid #6c5ce7;
    border-radius: 6px;
    background: transparent;
    color: #cdc6ff;
    cursor: pointer;
  }
  .diff.active { background: #6c5ce7; color: #fff; }
  .diff:hover { background: #5a4bd6; color: #fff; }
  #timerWrap {
    width: 480px;
    height: 18px;
    background: #2a2a3a;
    border-radius: 9px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  #timerBar {
    height: 100%;
    width: 100%;
    background: #2ecc71;
    transition: width 0.1s linear, background 0.3s;
  }
  #timerText {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }
  canvas {
    background: #2a2a3a;
    border: 4px solid #555;
    border-radius: 8px;
  }
  #msg {
    margin-top: 12px;
    font-size: 22px;
    font-weight: bold;
    min-height: 30px;
  }
  #restart {
    margin-top: 6px;
    padding: 8px 18px;
    font-size: 15px;
    border: none;
    border-radius: 6px;
    background: #6c5ce7;
    color: white;
    cursor: pointer;
  }
  #restart:hover { background: #5a4bd6; }
</style>
</head>
<body>
  <h1>🧩 미로찾기 - 30초 탈출</h1>
  <div id="info">방향키로 이동 · 30초 안에 초록색 도착점에 닿으세요!</div>

  <div id="controls">
    <button class="diff" data-level="easy">하 (9×9)</button>
    <button class="diff active" data-level="normal">중 (13×13)</button>
    <button class="diff" data-level="hard">상 (17×17)</button>
  </div>

  <div id="timerText">30.0</div>
  <div id="timerWrap"><div id="timerBar"></div></div>

  <canvas id="game" width="480" height="480"></canvas>
  <div id="msg"></div>
  <button id="restart">다시 시작 (R)</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');
const timerText = document.getElementById('timerText');
const timerBar = document.getElementById('timerBar');

const LEVELS = {
  easy:   { size: 9,  label: '하' },
  normal: { size: 13, label: '중' },
  hard:   { size: 17, label: '상' }
};
const TIME_LIMIT = 30000;

let level = 'normal';
let size, cell, grid, player, goal;
let startTime, rafId, running;

function makeGrid(n) {
  const g = [];
  for (let y = 0; y < n; y++) {
    const row = [];
    for (let x = 0; x < n; x++) {
      row.push({ visited: false, walls: { top: true, right: true, bottom: true, left: true } });
    }
    g.push(row);
  }
  return g;
}

function generateMaze(n) {
  grid = makeGrid(n);
  const opposite = { top: 'bottom', bottom: 'top', left: 'right', right: 'left' };
  const stack = [{ x: 0, y: 0 }];
  grid[0][0].visited = true;

  while (stack.length > 0) {
    const cur = stack[stack.length - 1];
    const nbrs = [];
    if (cur.y > 0 && !grid[cur.y - 1][cur.x].visited) nbrs.push({ x: cur.x, y: cur.y - 1, dir: 'top' });
    if (cur.x < n - 1 && !grid[cur.y][cur.x + 1].visited) nbrs.push({ x: cur.x + 1, y: cur.y, dir: 'right' });
    if (cur.y < n - 1 && !grid[cur.y + 1][cur.x].visited) nbrs.push({ x: cur.x, y: cur.y + 1, dir: 'bottom' });
    if (cur.x > 0 && !grid[cur.y][cur.x - 1].visited) nbrs.push({ x: cur.x - 1, y: cur.y, dir: 'left' });

    if (nbrs.length === 0) { stack.pop(); continue; }

    const next = nbrs[Math.floor(Math.random() * nbrs.length)];
    grid[cur.y][cur.x].walls[next.dir] = false;
    grid[next.y][next.x].walls[opposite[next.dir]] = false;
    grid[next.y][next.x].visited = true;
    stack.push({ x: next.x, y: next.y });
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#eee';
  ctx.lineWidth = size > 20 ? 1.5 : 2;

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const c = grid[y][x];
      const px = x * cell, py = y * cell;
      ctx.beginPath();
      if (c.walls.top) { ctx.moveTo(px, py); ctx.lineTo(px + cell, py); }
      if (c.walls.right) { ctx.moveTo(px + cell, py); ctx.lineTo(px + cell, py + cell); }
      if (c.walls.bottom) { ctx.moveTo(px, py + cell); ctx.lineTo(px + cell, py + cell); }
      if (c.walls.left) { ctx.moveTo(px, py); ctx.lineTo(px, py + cell); }
      ctx.stroke();
    }
  }

  const pad = Math.max(2, cell * 0.18);
  ctx.fillStyle = '#2ecc71';
  ctx.fillRect(goal.x * cell + pad, goal.y * cell + pad, cell - pad * 2, cell - pad * 2);

  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.arc(player.x * cell + cell / 2, player.y * cell + cell / 2, cell / 2 - pad, 0, Math.PI * 2);
  ctx.fill();
}

function tick() {
  const left = TIME_LIMIT - (Date.now() - startTime);
  if (left <= 0) {
    timerText.textContent = '0.0';
    timerBar.style.width = '0%';
    gameOver();
    return;
  }
  const ratio = left / TIME_LIMIT;
  timerText.textContent = (left / 1000).toFixed(1);
  timerBar.style.width = (ratio * 100) + '%';
  timerBar.style.background = ratio > 0.5 ? '#2ecc71' : ratio > 0.2 ? '#f1c40f' : '#e74c3c';
  timerText.style.color = ratio > 0.2 ? '#eee' : '#e74c3c';
  rafId = requestAnimationFrame(tick);
}

function gameOver() {
  running = false;
  cancelAnimationFrame(rafId);
  msg.style.color = '#e74c3c';
  msg.textContent = '💀 시간 초과! 실패';
}

function win() {
  running = false;
  cancelAnimationFrame(rafId);
  const used = ((Date.now() - startTime) / 1000).toFixed(1);
  msg.style.color = '#ffd700';
  msg.textContent = `🎉 탈출 성공! [${LEVELS[level].label}] ${used}초`;
}

function newGame() {
  cancelAnimationFrame(rafId);
  size = LEVELS[level].size;
  cell = canvas.width / size;
  generateMaze(size);
  player = { x: 0, y: 0 };
  goal = { x: size - 1, y: size - 1 };
  msg.textContent = '';
  running = true;
  startTime = Date.now();
  draw();
  tick();
}

function tryMove(dx, dy) {
  if (!running) return;
  const c = grid[player.y][player.x];
  if (dx === 1 && c.walls.right) return;
  if (dx === -1 && c.walls.left) return;
  if (dy === 1 && c.walls.bottom) return;
  if (dy === -1 && c.walls.top) return;

  player.x += dx;
  player.y += dy;
  draw();

  if (player.x === goal.x && player.y === goal.y) win();
}

document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowUp': tryMove(0, -1); e.preventDefault(); break;
    case 'ArrowDown': tryMove(0, 1); e.preventDefault(); break;
    case 'ArrowLeft': tryMove(-1, 0); e.preventDefault(); break;
    case 'ArrowRight': tryMove(1, 0); e.preventDefault(); break;
    case 'r': case 'R': newGame(); break;
  }
});

document.querySelectorAll('.diff').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    level = btn.dataset.level;
    newGame();
  });
});

document.getElementById('restart').addEventListener('click', newGame);

newGame();
</script>
</body>
</html>
